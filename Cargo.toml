[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/common",
    "crates/config",
    "crates/database",
    "crates/events",
    "crates/permissions",
    "crates/users",
    "crates/auth",
    "crates/social",
    "crates/communities",
    "crates/channels",
    "crates/messaging",
    "crates/notifications",
    "crates/voice",
    "crates/storage",
    "crates/audit",
    "crates/integrations",
    "crates/realtime",
    "crates/api",
    "crates/gateway",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bitflags = { version = "2.9", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
email_address = "0.2"
figment = { version = "0.10", features = ["toml", "env"] }
http = "1.2"
http-body-util = "0.1"
jsonwebtoken = "9.3"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
] }
rand = "0.10"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
    "trace",
    "request-id",
    "limit",
    "timeout",
    "cors",
    "compression-gzip",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
utoipa = { version = "6.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0", features = ["axum"] }
uuid = { version = "1.11", features = ["v7", "serde"] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
